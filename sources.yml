  florian-asche/PiCompose-Package-Software-HA-Satellite:
    packages:
      - picompose-software-ha-satellite
  florian-asche/PiCompose-Package-Driver-2MicHat-V1:
    packages:
      - picompose-driver-2michat-v1
  florian-asche/PiCompose-Package-Driver-2MicHat-V2:
    packages:
      - picompose-driver-2michat-v2
  florian-asche/PiCompose-Package-Driver-ReSpeaker-Lite:
    packages:
      - picompose-driver-respeaker-lite
  florian-asche/PiCompose-Package-Driver-Satellite1:
