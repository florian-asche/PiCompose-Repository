name: 🐛 Bug report
description: Report a problem with a PiCompose package, the APT repository or the build.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please read [AI_POLICY.md](https://github.com/florian-asche/PiCompose-Repository/blob/main/.github/AI_POLICY.md) before submitting. Image problems belong in the [PiCompose](https://github.com/florian-asche/PiCompose/issues) repository, issues for the voice assistant itself in the [linux-voice-assistant](https://github.com/OHF-Voice/linux-voice-assistant/issues) repository.
  - type: input
    id: package
    attributes:
      label: Package and version
      description: Output of `dpkg -s <package> | grep Version`.
      placeholder: picompose-hello 0.1.1
    validations:
      required: true
  - type: dropdown
    id: suite
    attributes:
      label: APT suite
      options:
        - trixie (stable)
        - trixie-nightly
        - trixie-test
        - Installed from a downloaded .deb
    validations:
      required: true
  - type: dropdown
    id: pi
    attributes:
      label: Device
      options:
        - Pi 5
        - Pi 4
        - Pi 3
        - Pi Zero 2 W
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead. Include the steps to reproduce it.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of the failing `apt` command and, for service problems, `journalctl -u <service>`.
      render: shell
  - type: checkboxes
    id: policy
    attributes:
      label: AI policy
      options:
        - label: I wrote or reviewed this report myself and it was not created by an autonomous agent.
          required: true
