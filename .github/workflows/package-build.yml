name: Build package

# Reusable workflow for package repositories. A package repository calls it from
# its build workflow:
#
#   on:
#     push:
#       branches: ['**']
#     pull_request:
#   concurrency:
#     group: build-${{ github.ref }}
#     cancel-in-progress: false
#   jobs:
#     package:
#       if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
#       uses: florian-asche/PiCompose-Repository/.github/workflows/package-build.yml@main
#       permissions:
#         contents: write
#       secrets:
#         hub-token: ${{ secrets.HUB_DISPATCH_TOKEN }}
#
# The version of the package is the first entry of debian/changelog.
#
# nightly (push to main): the commits since the last change of debian/changelog are
#   looked up with their merged pull requests. The highest label of major, minor and
#   patch decides which part of the version is raised. The workflow adds the changelog
#   entry (the titles of the pull requests), commits debian/changelog to main, builds
#   exactly that version and has it published to the suite trixie-nightly. No tag.
# dev (every other branch, pull requests from forks): <version>+dev<timestamp>.<sha>.
#   Nothing is published, the packages are workflow artifacts for 14 days.
# stable: built by package-release.yml from the tag of a release, with the version of
#   debian/changelog, and published to the suite trixie.

on:
  workflow_call:
    inputs:
      release-version:
        description: Version of the release to build (channel trixie), empty for trixie-nightly and dev
        type: string
        default: ''
    secrets:
      hub-token:
        description: Token that may start workflows of the APT repository (Actions, read and write)
        required: false

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      channel: ${{ steps.channel.outputs.channel }}
      version: ${{ steps.version.outputs.version }}
      ref: ${{ steps.version.outputs.ref }}
      entry_date: ${{ steps.version.outputs.entry_date }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - name: Select channel
        id: channel
        run: |
          channel=dev
          if [ -n "${{ inputs.release-version }}" ]; then
            channel=trixie
          elif [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_NAME}" = "main" ]; then
            channel=trixie-nightly
          fi
          echo "channel=${channel}" >> "${GITHUB_OUTPUT}"

      - name: Checkout package repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-version != '' && format('v{0}', inputs.release-version) || (steps.channel.outputs.channel == 'trixie-nightly' && 'main' || '') }}
          fetch-depth: 0

      - name: Checkout build scripts
        uses: actions/checkout@v4
        with:
          repository: florian-asche/PiCompose-Repository
          path: .picompose-repository

      - name: Compute version and changelog
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ steps.channel.outputs.channel }}
          RELEASE_VERSION: ${{ inputs.release-version }}
        run: |
          scripts=.picompose-repository/scripts
          mkdir -p "${RUNNER_TEMP}/notes"
          notes="${RUNNER_TEMP}/notes/notes.txt"
          skip=false
          ref=""
          entry_date=""
          if [ "${CHANNEL}" = "trixie" ]; then
            first_line="$(head -n 1 debian/changelog)"
            if [[ "${first_line}" != *"(${RELEASE_VERSION})"* ]]; then
              echo "::error::The first entry of debian/changelog is not ${RELEASE_VERSION}: ${first_line}"
              exit 1
            fi
            version="${RELEASE_VERSION}"
            ref="v${RELEASE_VERSION}"
          elif [ "${CHANNEL}" = "trixie-nightly" ]; then
            version="$(python3 "${scripts}/package-version.py" bump --repository "${GITHUB_REPOSITORY}" --notes-file "${notes}")"
            if [ -z "${version}" ]; then
              echo "No new commits since the last version, nothing to build."
              skip=true
            else
              cat "${notes}"
              python3 "${scripts}/make-changelog.py" . --version "${version}" --notes-file "${notes}" --date "$(date -R)"
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add debian/changelog
              git commit -m "Version ${version}"
              git push origin HEAD:main || { git pull --rebase origin main && git push origin HEAD:main; }
              ref="$(git rev-parse HEAD)"
            fi
          else
            version="$(python3 "${scripts}/package-version.py" dev --stamp "$(date -u +%Y%m%d%H%M%S)" --sha "${GITHUB_SHA::7}")"
            gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" -q '.[0] | select(. != null) | .title + "\n\n" + (.body // "")' > "${notes}" || true
            if [ ! -s "${notes}" ]; then
              git log -1 --format=%B > "${notes}"
            fi
            entry_date="$(date -R)"
          fi
          {
            echo "version=${version}"
            echo "ref=${ref}"
            echo "entry_date=${entry_date}"
            echo "skip=${skip}"
          } >> "${GITHUB_OUTPUT}"
          echo "${version}"

      - name: Upload changelog text
        if: steps.channel.outputs.channel == 'dev'
        uses: actions/upload-artifact@v4
        with:
          name: changelog-notes
          path: ${{ runner.temp }}/notes/notes.txt
          if-no-files-found: error
          retention-days: 1

      - name: Compute matrix
        id: matrix
        run: |
          matrix="$(python3 .picompose-repository/scripts/arch-matrix.py .)"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
          echo "${matrix}"

  build:
    name: Build (${{ matrix.arch }})
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout package repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Checkout build scripts
        uses: actions/checkout@v4
        with:
          repository: florian-asche/PiCompose-Repository
          path: .picompose-repository

      - name: Set up QEMU for 32-bit ARM
        if: matrix.arch == 'armhf'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm/v7

      - name: Download changelog text
        if: needs.prepare.outputs.channel == 'dev'
        uses: actions/download-artifact@v4
        with:
          name: changelog-notes
          path: ${{ runner.temp }}/notes

      - name: Build package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ENTRY_DATE: ${{ needs.prepare.outputs.entry_date }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          changelog=()
          if [ "${CHANNEL}" = "dev" ]; then
            changelog=(--version "${VERSION}" --notes-file "${RUNNER_TEMP}/notes/notes.txt" --date "${ENTRY_DATE}")
          fi
          ./.picompose-repository/scripts/build-package.sh . "${{ matrix.arch }}" "${changelog[@]}" --out "${RUNNER_TEMP}/out"
          mkdir out && cp "${RUNNER_TEMP}"/out/*.deb out/

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: out/*.deb
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish
    needs: [prepare, build]
    if: needs.prepare.outputs.skip != 'true' && (needs.prepare.outputs.channel == 'trixie' || needs.prepare.outputs.channel == 'trixie-nightly')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      CHANNEL: ${{ needs.prepare.outputs.channel }}
    steps:
      - name: Attach packages to the release
        if: needs.prepare.outputs.channel == 'trixie'
        uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          merge-multiple: true
          path: debs

      - name: Upload to the GitHub release
        if: needs.prepare.outputs.channel == 'trixie'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ needs.prepare.outputs.version }}" debs/*.deb --repo "${GITHUB_REPOSITORY}" --clobber

      - name: Tell the APT repository to publish
        env:
          GH_TOKEN: ${{ secrets.hub-token }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::The secret hub-token is not set, so the APT repository was not notified."
            exit 1
          fi
          gh workflow run publish.yml --repo florian-asche/PiCompose-Repository --ref main \
            -f "repository=${GITHUB_REPOSITORY}" -f "channel=${CHANNEL}" -f "run_id=${GITHUB_RUN_ID}"
