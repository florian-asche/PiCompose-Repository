name: Build package

# Reusable workflow for package repositories. A package repository calls it
# from its own workflows:
#
#   build.yml (push and pull request)
#     jobs:
#       package:
#         uses: florian-asche/PiCompose-Repository/.github/workflows/package-build.yml@main
#         permissions:
#           contents: write
#         secrets:
#           hub-token: ${{ secrets.HUB_DISPATCH_TOKEN }}
#
# A push to main builds the nightly channel. Every other branch and pull requests
# from forks build the dev channel: nothing is published, the packages are kept as
# workflow artifacts for 14 days. The channel stable is built by package-release.yml,
# which passes the version of the release.
#
# debian/changelog holds the releases. stable builds it as it is. nightly and dev
# add an entry made from the text of the pull request of the commit (or the commit
# message) in the build only, with the version <last release>+git<timestamp>.<sha>
# or <last release>+dev<timestamp>.<sha> (see scripts/package-version.py).
# The packages of a stable or nightly build are attached to a GitHub release of the
# package repository and the APT repository is told to publish them.

on:
  workflow_call:
    inputs:
      release-version:
        description: Version of the release to build (channel stable), empty for nightly and dev
        type: string
        default: ''
    secrets:
      hub-token:
        description: Token that may start workflows of the APT repository (Actions, read and write)
        required: false

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare build
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      channel: ${{ steps.channel.outputs.channel }}
      version: ${{ steps.version.outputs.version }}
      entry_date: ${{ steps.version.outputs.entry_date }}
    steps:
      - name: Checkout package repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-version != '' && format('v{0}', inputs.release-version) || '' }}
          fetch-depth: 0

      - name: Checkout build scripts
        uses: actions/checkout@v4
        with:
          repository: florian-asche/PiCompose-Repository
          path: .picompose-repository

      - name: Select channel
        id: channel
        run: |
          channel=dev
          if [ -n "${{ inputs.release-version }}" ]; then
            channel=stable
          elif [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_NAME}" = "main" ]; then
            channel=nightly
          fi
          echo "channel=${channel}" >> "${GITHUB_OUTPUT}"

      - name: Compute version and changelog text
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ steps.channel.outputs.channel }}
          RELEASE_VERSION: ${{ inputs.release-version }}
        run: |
          mkdir -p "${RUNNER_TEMP}/notes"
          script=.picompose-repository/scripts/package-version.py
          if [ "${CHANNEL}" = "stable" ]; then
            first_line="$(head -n 1 debian/changelog)"
            if [[ "${first_line}" != *"(${RELEASE_VERSION})"* ]]; then
              echo "::error::The first entry of debian/changelog is not ${RELEASE_VERSION}: ${first_line}"
              exit 1
            fi
            version="${RELEASE_VERSION}"
            entry_date=""
          else
            version="$(python3 "${script}" --channel "${CHANNEL}" --stamp "$(date -u +%Y%m%d%H%M%S)" --sha "${GITHUB_SHA::7}")"
            gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" -q '.[0] | select(. != null) | .title + "\n\n" + (.body // "")' > "${RUNNER_TEMP}/notes/notes.txt" || true
            if [ ! -s "${RUNNER_TEMP}/notes/notes.txt" ]; then
              git log -1 --format=%B > "${RUNNER_TEMP}/notes/notes.txt"
            fi
            entry_date="$(date -R)"
            cat "${RUNNER_TEMP}/notes/notes.txt"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "entry_date=${entry_date}" >> "${GITHUB_OUTPUT}"
          echo "${version}"

      - name: Upload changelog text
        if: steps.channel.outputs.channel != 'stable'
        uses: actions/upload-artifact@v4
        with:
          name: changelog-notes
          path: ${{ runner.temp }}/notes/notes.txt
          if-no-files-found: error
          retention-days: 1

      - name: Compute matrix
        id: matrix
        run: |
          matrix="$(python3 .picompose-repository/scripts/arch-matrix.py .)"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
          echo "${matrix}"

  build:
    name: Build (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout package repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-version != '' && format('v{0}', inputs.release-version) || '' }}

      - name: Checkout build scripts
        uses: actions/checkout@v4
        with:
          repository: florian-asche/PiCompose-Repository
          path: .picompose-repository

      - name: Set up QEMU for 32-bit ARM
        if: matrix.arch == 'armhf'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm/v7

      - name: Download changelog text
        if: needs.prepare.outputs.channel != 'stable'
        uses: actions/download-artifact@v4
        with:
          name: changelog-notes
          path: ${{ runner.temp }}/notes

      - name: Build package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ENTRY_DATE: ${{ needs.prepare.outputs.entry_date }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          changelog=()
          if [ "${CHANNEL}" != "stable" ]; then
            changelog=(--version "${VERSION}" --notes-file "${RUNNER_TEMP}/notes/notes.txt" --date "${ENTRY_DATE}")
          fi
          ./.picompose-repository/scripts/build-package.sh . "${{ matrix.arch }}" "${changelog[@]}" --out "${RUNNER_TEMP}/out"
          mkdir out && cp "${RUNNER_TEMP}"/out/*.deb out/

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: out/*.deb
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release and publish
    needs: [prepare, build]
    if: needs.prepare.outputs.channel == 'stable' || needs.prepare.outputs.channel == 'nightly'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      CHANNEL: ${{ needs.prepare.outputs.channel }}
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          merge-multiple: true
          path: debs

      - name: Attach packages to a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${CHANNEL}" = "stable" ]; then
            tag="v${{ inputs.release-version }}"
            gh release upload "${tag}" debs/*.deb --repo "${GITHUB_REPOSITORY}" --clobber
          else
            tag="${CHANNEL}"
            gh release delete "${tag}" --repo "${GITHUB_REPOSITORY}" --cleanup-tag --yes || true
            gh release create "${tag}" debs/*.deb --repo "${GITHUB_REPOSITORY}" --prerelease \
              --target "${GITHUB_SHA}" --title "${CHANNEL} build" \
              --notes "Automatic ${CHANNEL} build of ${GITHUB_SHA}. Replaced by every push."
          fi
          echo "TAG=${tag}" >> "${GITHUB_ENV}"

      - name: Tell the APT repository to publish
        env:
          GH_TOKEN: ${{ secrets.hub-token }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::The secret hub-token is not set, so the APT repository was not notified."
            exit 1
          fi
          gh workflow run publish.yml --repo florian-asche/PiCompose-Repository --ref main \
            -f "repository=${GITHUB_REPOSITORY}" -f "channel=${CHANNEL}" -f "tag=${TAG}"
