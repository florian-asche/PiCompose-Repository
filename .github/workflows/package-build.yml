name: Build package

# Reusable workflow for package repositories. A package repository calls it
# from its own workflow:
#
#   jobs:
#     package:
#       uses: florian-asche/PiCompose-Repository/.github/workflows/package-build.yml@main
#       permissions:
#         contents: write
#       secrets:
#         hub-token: ${{ secrets.HUB_DISPATCH_TOKEN }}
#
# A push to main builds the nightly channel, a published release the stable
# channel. Both are published to the APT repository. Every other branch and
# pull requests from forks build the dev channel: nothing is published, the
# packages are kept as workflow artifacts for 14 days.
#
# The package repository does not maintain debian/changelog, the build writes it
# (see scripts/package-version.py and scripts/make-changelog.py):
#   stable   version of the release tag, which has to be the version the commits
#            since the last tag lead to; text of the release
#   nightly  next version after the newest tag, raised by #major or #minor in
#            the text of a commit or pull request (patch by default); text of the
#            pull request of the commit
#   dev      next patch version; text of the pull request of the commit
# The packages of a release or nightly build are attached to a GitHub release of
# the package repository and the APT repository is told to publish them.

on:
  workflow_call:
    secrets:
      hub-token:
        description: Token that may send repository_dispatch events to the APT repository
        required: false

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare build
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      channel: ${{ steps.channel.outputs.channel }}
      version: ${{ steps.version.outputs.version }}
      entry_date: ${{ steps.version.outputs.entry_date }}
    steps:
      - name: Checkout package repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout build scripts
        uses: actions/checkout@v4
        with:
          repository: florian-asche/PiCompose-Repository
          path: .picompose-repository

      - name: Select channel
        id: channel
        run: |
          channel=dev
          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            channel=stable
          elif [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            if [ "${GITHUB_REF_NAME}" = "main" ]; then
              channel=nightly
            else
              channel=dev
            fi
          elif [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            channel=dev
          fi
          echo "channel=${channel}" >> "${GITHUB_OUTPUT}"

      - name: Compute version and changelog text
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ steps.channel.outputs.channel }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_DATE: ${{ github.event.release.published_at }}
        run: |
          mkdir -p "${RUNNER_TEMP}/notes"
          script=.picompose-repository/scripts/package-version.py
          stamp="$(date -u +%Y%m%d%H%M%S)"
          if [ "${CHANNEL}" = "stable" ]; then
            version="$(python3 "${script}" --channel stable --tag "${RELEASE_TAG}" --repository "${GITHUB_REPOSITORY}")"
            printf '%s\n' "${RELEASE_BODY}" > "${RUNNER_TEMP}/notes/notes.txt"
            entry_date="$(date -u -d "${RELEASE_DATE}" -R)"
          else
            version="$(python3 "${script}" --channel "${CHANNEL}" --stamp "${stamp}" --sha "${GITHUB_SHA::7}" --repository "${GITHUB_REPOSITORY}")"
            gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" -q '.[0] | select(. != null) | .title + "\n\n" + (.body // "")' > "${RUNNER_TEMP}/notes/notes.txt" || true
            if [ ! -s "${RUNNER_TEMP}/notes/notes.txt" ]; then
              git log -1 --format=%B > "${RUNNER_TEMP}/notes/notes.txt"
            fi
            entry_date="$(date -u -R)"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "entry_date=${entry_date}" >> "${GITHUB_OUTPUT}"
          echo "${version}"
          cat "${RUNNER_TEMP}/notes/notes.txt"

      - name: Upload changelog text
        uses: actions/upload-artifact@v4
        with:
          name: changelog-notes
          path: ${{ runner.temp }}/notes/notes.txt
          if-no-files-found: error
          retention-days: 1

      - name: Compute matrix
        id: matrix
        run: |
          matrix="$(python3 .picompose-repository/scripts/arch-matrix.py .)"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
          echo "${matrix}"

  build:
    name: Build (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout package repository
        uses: actions/checkout@v4

      - name: Checkout build scripts
        uses: actions/checkout@v4
        with:
          repository: florian-asche/PiCompose-Repository
          path: .picompose-repository

      - name: Set up QEMU for 32-bit ARM
        if: matrix.arch == 'armhf'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm/v7

      - name: Download changelog text
        uses: actions/download-artifact@v4
        with:
          name: changelog-notes
          path: ${{ runner.temp }}/notes

      - name: Build package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ENTRY_DATE: ${{ needs.prepare.outputs.entry_date }}
        run: |
          ./.picompose-repository/scripts/build-package.sh . "${{ matrix.arch }}" --version "${VERSION}" \
            --notes-file "${RUNNER_TEMP}/notes/notes.txt" --date "${ENTRY_DATE}" --out "${RUNNER_TEMP}/out"
          mkdir out && cp "${RUNNER_TEMP}"/out/*.deb out/

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: out/*.deb
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release and publish
    needs: [prepare, build]
    if: needs.prepare.outputs.channel == 'stable' || needs.prepare.outputs.channel == 'nightly'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      CHANNEL: ${{ needs.prepare.outputs.channel }}
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          merge-multiple: true
          path: debs

      - name: Attach packages to a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${CHANNEL}" = "stable" ]; then
            tag="${{ github.event.release.tag_name }}"
            gh release upload "${tag}" debs/*.deb --repo "${GITHUB_REPOSITORY}" --clobber
          else
            tag="${CHANNEL}"
            gh release delete "${tag}" --repo "${GITHUB_REPOSITORY}" --cleanup-tag --yes || true
            gh release create "${tag}" debs/*.deb --repo "${GITHUB_REPOSITORY}" --prerelease \
              --target "${GITHUB_SHA}" --title "${CHANNEL} build" \
              --notes "Automatic ${CHANNEL} build of ${GITHUB_SHA}. Replaced by every push."
          fi
          echo "TAG=${tag}" >> "${GITHUB_ENV}"

      - name: Tell the APT repository to publish
        env:
          GH_TOKEN: ${{ secrets.hub-token }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::The secret hub-token is not set, so the APT repository was not notified."
            exit 1
          fi
          gh api repos/florian-asche/PiCompose-Repository/dispatches \
            -f event_type=package-published \
            -f "client_payload[repository]=${GITHUB_REPOSITORY}" \
            -f "client_payload[channel]=${CHANNEL}" \
            -f "client_payload[tag]=${TAG}"
