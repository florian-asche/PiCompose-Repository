name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint scripts and workflows
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install linters
        run: sudo apt-get update && sudo apt-get install -y shellcheck yamllint python3-yaml

      - name: Shell scripts
        run: |
          bash -n scripts/*.sh
          shellcheck scripts/*.sh

      - name: Python scripts
        run: python3 -m py_compile scripts/*.py && find scripts -name __pycache__ -prune -exec rm -rf {} +

      - name: YAML files
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: disable}}" .github/workflows sources.yml
