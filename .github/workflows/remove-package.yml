name: Remove a package from the APT repository

# Started by hand (Actions, Run workflow). Removes all versions of a package from one suite:
# stable is the suite trixie, nightly is the suite trixie-nightly. Run it again for the other suite.
# Only packages that are no longer listed in sources.yml can be removed, for example after a rename,
# because the token that starts the publish workflows could start this one as well.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Channel to remove the package from (stable is the suite trixie, nightly is trixie-nightly)
        required: true
        type: choice
        options:
          - stable
          - nightly
      package:
        description: Name of the package to remove, for example picompose-driver-satellite1
        required: true

permissions:
  contents: read

jobs:
  remove:
    name: Remove
    runs-on: ubuntu-24.04
    environment: apt-publish
    concurrency:
      group: apt-publish
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      CHANNEL: ${{ inputs.channel }}
      PACKAGE: ${{ inputs.package }}
    steps:
      - name: Validate the request
        run: |
          [[ "${PACKAGE}" =~ ^[a-z0-9][a-z0-9+.-]+$ ]] || { echo "::error::Invalid package name"; exit 1; }
          case "${CHANNEL}" in
            stable) echo "SUITE=trixie" >> "${GITHUB_ENV}" ;;
            nightly) echo "SUITE=trixie-nightly" >> "${GITHUB_ENV}" ;;
            *) echo "::error::Invalid channel"; exit 1 ;;
          esac

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y reprepro python3-yaml

      - name: Refuse packages that are still published
        run: |
          python3 - <<'PYEOF'
          import os
          import sys

          import yaml

          package = os.environ["PACKAGE"]
          repositories = (yaml.safe_load(open("sources.yml", encoding="utf-8")) or {}).get("repositories", {})
          for repository, entry in repositories.items():
              if package in entry.get("packages", []):
                  sys.exit(f"{package} is listed in sources.yml for {repository}. Remove it from sources.yml first.")
          PYEOF

      - name: Import signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: echo "${APT_GPG_PRIVATE_KEY}" | gpg --batch --import

      - name: Check out the published repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_URL: github.com/${{ github.repository }}.git
        run: git clone --branch gh-pages --depth 1 "https://x-access-token:${GH_TOKEN}@${REPO_URL}" apt-repo

      - name: Remove the package
        run: |
          mkdir -p apt-repo/conf
          cp apt/conf/* apt-repo/conf/
          if [ -z "$(reprepro --basedir apt-repo list "${SUITE}" "${PACKAGE}")" ]; then
            echo "${PACKAGE} is not in ${SUITE}, nothing to remove."
            exit 0
          fi
          reprepro --basedir apt-repo remove "${SUITE}" "${PACKAGE}"
          reprepro --basedir apt-repo deleteunreferenced

      - name: Push the published repository
        run: |
          cd apt-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --quiet && { echo "Nothing to push."; exit 0; }
          git commit -m "Remove ${PACKAGE} from ${SUITE}"
          git push origin gh-pages
