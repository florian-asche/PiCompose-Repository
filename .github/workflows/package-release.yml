name: Release package

# Reusable workflow for package repositories. A package repository calls it from a
# workflow that is started by hand and asks for nothing:
#
#   on:
#     workflow_dispatch:
#   jobs:
#     release:
#       uses: florian-asche/PiCompose-Repository/.github/workflows/package-release.yml@main
#       permissions:
#         contents: write
#       secrets:
#         hub-token: ${{ secrets.HUB_DISPATCH_TOKEN }}
#
# The version of a release is the first entry of debian/changelog on main, which the
# nightly build wrote when the last pull request was merged. The workflow tags the
# newest commit of main v<version>, creates the GitHub release with the notes GitHub
# generates from the pull requests since the last release, and builds and publishes
# that version from the tag to the suite trixie.

on:
  workflow_call:
    secrets:
      hub-token:
        description: Token that may start workflows of the APT repository (Actions, read and write)
        required: false

permissions:
  contents: read

jobs:
  release:
    name: Create release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout package repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create the release
        id: release
        run: |
          first_line="$(head -n 1 debian/changelog)"
          version="$(sed -E 's/^[^(]*\(([^)]*)\).*/\1/' <<< "${first_line}")"
          if [ "${version}" = "0.0.0" ] || [ -z "${version}" ]; then
            echo "::error::debian/changelog has no version yet. Merge a pull request first."
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/v${version}" >/dev/null; then
            echo "::error::Version ${version} is released already (tag v${version}). Merge a pull request to get a new version."
            exit 1
          fi
          previous="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
          args=(-f "tag_name=v${version}" -f target_commitish=main)
          if [ -n "${previous}" ]; then
            args+=(-f "previous_tag_name=${previous}")
          fi
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" "${args[@]}" -q .body > "${RUNNER_TEMP}/notes.txt"
          gh release create "v${version}" --target "$(git rev-parse HEAD)" --title "v${version}" --notes-file "${RUNNER_TEMP}/notes.txt"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  package:
    name: Package
    needs: release
    uses: florian-asche/PiCompose-Repository/.github/workflows/package-build.yml@main
    with:
      release-version: ${{ needs.release.outputs.version }}
    permissions:
      contents: write
    secrets:
      hub-token: ${{ secrets.hub-token }}
