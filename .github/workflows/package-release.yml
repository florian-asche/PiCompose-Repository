name: Release package

# Reusable workflow for package repositories. A package repository calls it from a
# workflow that is started by hand and asks for the version:
#
#   on:
#     workflow_dispatch:
#       inputs:
#         version:
#           description: Version of the release, higher than the last one, for example 1.2.3
#           required: true
#   jobs:
#     release:
#       uses: florian-asche/PiCompose-Repository/.github/workflows/package-release.yml@main
#       with:
#         version: ${{ inputs.version }}
#       permissions:
#         contents: write
#       secrets:
#         hub-token: ${{ secrets.HUB_DISPATCH_TOKEN }}
#
# The workflow checks the version, writes the changelog entry from the notes that
# GitHub generates from the merged pull requests since the last release, commits
# debian/changelog to main, tags that commit v<version>, creates the GitHub release
# and builds and publishes the stable packages from the tag.

on:
  workflow_call:
    inputs:
      version:
        description: Version of the release, higher than the last one, for example 1.2.3
        type: string
        required: true
    secrets:
      hub-token:
        description: Token that may start workflows of the APT repository (Actions, read and write)
        required: false

permissions:
  contents: read

jobs:
  release:
    name: Write changelog and create release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout package repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout build scripts
        uses: actions/checkout@v4
        with:
          repository: florian-asche/PiCompose-Repository
          path: .picompose-repository

      - name: Check the version
        run: |
          python3 .picompose-repository/scripts/package-version.py --release-version "${VERSION}"
          if git rev-parse --verify --quiet "refs/tags/v${VERSION}" >/dev/null; then
            echo "::error::The tag v${VERSION} exists already"
            exit 1
          fi

      - name: Write the changelog entry
        run: |
          previous="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
          args=(-f "tag_name=v${VERSION}" -f target_commitish=main)
          if [ -n "${previous}" ]; then
            args+=(-f "previous_tag_name=${previous}")
          fi
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" "${args[@]}" -q .body > "${RUNNER_TEMP}/notes.txt"
          cat "${RUNNER_TEMP}/notes.txt"
          python3 .picompose-repository/scripts/make-changelog.py . --version "${VERSION}" --notes-file "${RUNNER_TEMP}/notes.txt" --date "$(date -R)"

      - name: Commit the changelog and create the release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debian/changelog
          git commit -m "Release ${VERSION}"
          git push origin HEAD:main
          gh release create "v${VERSION}" --target "$(git rev-parse HEAD)" --title "v${VERSION}" --notes-file "${RUNNER_TEMP}/notes.txt"

  package:
    name: Package
    needs: release
    uses: florian-asche/PiCompose-Repository/.github/workflows/package-build.yml@main
    with:
      release-version: ${{ inputs.version }}
    permissions:
      contents: write
    secrets:
      hub-token: ${{ secrets.hub-token }}
