name: Publish to APT repository

# Started by a package repository after it built packages (see package-tag-build.yml),
# or by hand to publish a build again. The packages are the artifacts of a workflow run
# of a repository that is listed in sources.yml. The run has to be a build of a version
# tag of that repository itself: of a pre-release for trixie-nightly, of a release for trixie.
# Runs of the previous flow (package-build.yml on main, package-release.yml) are still
# accepted. The packages are checked, signed and added to the suite of the channel:
# The channel is the name of the suite: trixie and trixie-nightly.

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Package repository, for example florian-asche/PiCompose-Package-Software-Hello
        required: true
      channel:
        description: Channel
        required: true
        type: choice
        options:
          - trixie
          - trixie-nightly
      run_id:
        description: ID of the workflow run of the package repository that built the packages
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-24.04
    environment: apt-publish
    concurrency:
      group: apt-publish
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      REPOSITORY: ${{ inputs.repository }}
      CHANNEL: ${{ inputs.channel }}
      RUN_ID: ${{ inputs.run_id }}
    steps:
      - name: Validate the request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "${REPOSITORY}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "::error::Invalid repository"; exit 1; }
          [[ "${RUN_ID}" =~ ^[0-9]+$ ]] || { echo "::error::Invalid run ID"; exit 1; }
          run="$(gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}")"
          read -r head_repository head_branch event path conclusion < <(jq -r '[.head_repository.full_name, .head_branch, .event, (.path | split("@")[0]), (.conclusion // "none")] | @tsv' <<< "${run}")
          if [ "${head_repository}" != "${REPOSITORY}" ] || [ "${conclusion}" = failure ] || [ "${conclusion}" = cancelled ]; then
            echo "::error::Run ${RUN_ID} is not a successful run of ${REPOSITORY}: ${head_repository} ${conclusion}"
            exit 1
          fi
          if [[ "${head_branch}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            # Build of a tag: a pre-release for trixie-nightly, a release for stable.
            prerelease="$(gh api "repos/${REPOSITORY}/releases/tags/${head_branch}" -q .prerelease)"
            case "${CHANNEL}" in
              trixie-nightly) ok=$([ "${event}" = workflow_dispatch ] && [ "${prerelease}" = true ] && echo yes || echo no) ;;
              trixie) ok=$([ "${event}" = release ] && [ "${prerelease}" = false ] && echo yes || echo no) ;;
              *) ok=no ;;
            esac
            [ "${path}" = .github/workflows/tag-build.yml ] || ok=no
          else
            # Previous flow: build of main (trixie-nightly) or release workflow (trixie).
            case "${CHANNEL}" in
              trixie-nightly) [ "${head_branch}" = main ] && [ "${event}" = push ] && [ "${path}" = .github/workflows/build.yml ] && ok=yes || ok=no ;;
              trixie) [ "${head_branch}" = main ] && [ "${event}" = workflow_dispatch ] && [ "${path}" = .github/workflows/release.yml ] && ok=yes || ok=no ;;
              *) ok=no ;;
            esac
          fi
          if [ "${ok}" != yes ]; then
            echo "::error::Run ${RUN_ID} is not a ${CHANNEL} build of ${REPOSITORY}: ${head_branch} ${event} ${path}"
            exit 1
          fi

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y reprepro python3-yaml

      - name: Download and check packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${RUN_ID}" --repo "${REPOSITORY}" --pattern 'deb-*' --dir downloaded
          mkdir debs
          find downloaded -name '*.deb' -exec mv {} debs/ \;
          python3 scripts/check-debs.py --repository "${REPOSITORY}" --channel "${CHANNEL}" --debs debs

      - name: Import signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          echo "${APT_GPG_PRIVATE_KEY}" | gpg --batch --import
          gpg --list-secret-keys

      - name: Check out the published repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_URL: github.com/${{ github.repository }}.git
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git clone --branch gh-pages --depth 1 "https://x-access-token:${GH_TOKEN}@${REPO_URL}" apt-repo
          else
            git init --initial-branch gh-pages apt-repo
            git -C apt-repo remote add origin "https://x-access-token:${GH_TOKEN}@${REPO_URL}"
          fi

      - name: Add packages
        env:
          APT_DOMAIN: ${{ vars.APT_DOMAIN }}
        run: |
          if [ "${CHANNEL}" = trixie ]; then
            ./scripts/publish-apt.sh --suite trixie --debs debs --repo apt-repo
          else
            ./scripts/publish-apt.sh --suite trixie-nightly --debs debs --repo apt-repo --replace
          fi

      - name: Push the published repository
        run: |
          cd apt-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Publish ${REPOSITORY} ${CHANNEL} run ${RUN_ID}"
          git push origin gh-pages
