name: Publish to APT repository

# Started by a package repository after it built packages (see package-build.yml), or
# by hand to publish a build again. The packages are the artifacts of a workflow run of
# a repository that is listed in sources.yml. The run has to be a build of main (nightly)
# or a release (stable) of that repository itself. The packages are checked, signed and
# added to the suite of the channel: stable to trixie and nightly to trixie-nightly.

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Package repository, for example florian-asche/PiCompose-Package-Hello
        required: true
      channel:
        description: Channel
        required: true
        type: choice
        options:
          - stable
          - nightly
      run_id:
        description: ID of the workflow run of the package repository that built the packages
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-24.04
    environment: apt-publish
    concurrency:
      group: apt-publish
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      REPOSITORY: ${{ inputs.repository }}
      CHANNEL: ${{ inputs.channel }}
      RUN_ID: ${{ inputs.run_id }}
    steps:
      - name: Validate the request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "${REPOSITORY}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "::error::Invalid repository"; exit 1; }
          [[ "${RUN_ID}" =~ ^[0-9]+$ ]] || { echo "::error::Invalid run ID"; exit 1; }
          run="$(gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}")"
          read -r head_repository head_branch event path conclusion < <(jq -r '[.head_repository.full_name, .head_branch, .event, (.path | split("@")[0]), (.conclusion // "none")] | @tsv' <<< "${run}")
          case "${CHANNEL}" in
            nightly) expected_event=push; expected_path=.github/workflows/build.yml ;;
            stable) expected_event=workflow_dispatch; expected_path=.github/workflows/release.yml ;;
            *) echo "::error::Invalid channel"; exit 1 ;;
          esac
          if [ "${head_repository}" != "${REPOSITORY}" ] || [ "${head_branch}" != main ] || [ "${event}" != "${expected_event}" ] \
            || [ "${path}" != "${expected_path}" ] || [ "${conclusion}" = failure ] || [ "${conclusion}" = cancelled ]; then
            echo "::error::Run ${RUN_ID} is not a ${CHANNEL} build of main of ${REPOSITORY}: ${head_repository} ${head_branch} ${event} ${path} ${conclusion}"
            exit 1
          fi

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y reprepro python3-yaml

      - name: Download and check packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${RUN_ID}" --repo "${REPOSITORY}" --pattern 'deb-*' --dir downloaded
          mkdir debs
          find downloaded -name '*.deb' -exec mv {} debs/ \;
          python3 scripts/check-debs.py --repository "${REPOSITORY}" --channel "${CHANNEL}" --debs debs

      - name: Import signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          echo "${APT_GPG_PRIVATE_KEY}" | gpg --batch --import
          gpg --list-secret-keys

      - name: Check out the published repository
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git clone --branch gh-pages --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apt-repo
          else
            git init --initial-branch gh-pages apt-repo
            git -C apt-repo remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          fi

      - name: Add packages
        env:
          APT_DOMAIN: ${{ vars.APT_DOMAIN }}
        run: |
          if [ "${CHANNEL}" = stable ]; then
            ./scripts/publish-apt.sh --suite trixie --debs debs --repo apt-repo
          else
            ./scripts/publish-apt.sh --suite trixie-nightly --debs debs --repo apt-repo --replace
          fi

      - name: Push the published repository
        run: |
          cd apt-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Publish ${REPOSITORY} ${CHANNEL} run ${RUN_ID}"
          git push origin gh-pages
